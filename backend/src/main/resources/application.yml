server:
  port: ${SERVER_PORT:8880}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: gying-movie
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gying?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

minio:
  endpoint: ${MINIO_ENDPOINT:localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:miniopassword}
  bucket: ${MINIO_BUCKET:gying}
  secure: ${MINIO_SECURE:false}
  url-prefix: ${MINIO_URL_PREFIX:http://localhost:9000/gying/}

app:
  internal-token: ${APP_INTERNAL_TOKEN:}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

gying-source:
  base-url: ${GYING_SOURCE_BASE_URL:http://localhost:8091}
  token: ${GYING_SOURCE_API_TOKEN:}

resource-hub:
  enabled: ${RESOURCE_HUB_ENABLED:false}
  auto-approve: ${RESOURCE_HUB_AUTO_APPROVE:true}
  tmdb:
    base-url: ${TMDB_API_BASE_URL:https://api.themoviedb.org/3}
    api-key: ${TMDB_API_KEY:}
    auto-sync-enabled: ${RESOURCE_HUB_TMDB_AUTO_SYNC_ENABLED:false}
    auto-sync-sources: ${RESOURCE_HUB_TMDB_AUTO_SYNC_SOURCES:TRENDING_MOVIE_DAY,TRENDING_TV_DAY,POPULAR_MOVIE,POPULAR_TV}
    auto-sync-page: ${RESOURCE_HUB_TMDB_AUTO_SYNC_PAGE:1}
    auto-sync-max-items: ${RESOURCE_HUB_TMDB_AUTO_SYNC_MAX_ITEMS:20}
    auto-sync-interval-hours: ${RESOURCE_HUB_TMDB_AUTO_SYNC_INTERVAL_HOURS:24}
    auto-discovery-enabled: ${RESOURCE_HUB_TMDB_AUTO_DISCOVERY_ENABLED:true}
    discovery-max-results: ${RESOURCE_HUB_TMDB_DISCOVERY_MAX_RESULTS:10}
    discovery-cooldown-hours: ${RESOURCE_HUB_TMDB_DISCOVERY_COOLDOWN_HOURS:24}
    request-interval-ms: ${TMDB_REQUEST_INTERVAL_MS:250}
    max-retries: ${TMDB_MAX_RETRIES:2}
  gying:
    discovery-enabled: ${RESOURCE_HUB_GYING_DISCOVERY_ENABLED:true}
    auto-sync-enabled: ${RESOURCE_HUB_GYING_AUTO_SYNC_ENABLED:false}
    auto-sync-sources: ${RESOURCE_HUB_GYING_AUTO_SYNC_SOURCES:HITS_MOVIE,HITS_TV,HITS_ANIME}
    auto-sync-page: ${RESOURCE_HUB_GYING_AUTO_SYNC_PAGE:1}
    auto-sync-max-items: ${RESOURCE_HUB_GYING_AUTO_SYNC_MAX_ITEMS:10}
    auto-sync-interval-hours: ${RESOURCE_HUB_GYING_AUTO_SYNC_INTERVAL_HOURS:24}
  pansou:
    base-url: ${RESOURCE_HUB_PANSOU_BASE_URL:http://localhost:8888}
    token: ${RESOURCE_HUB_PANSOU_TOKEN:}
    api-base-url: ${PANSOU_API_BASE_URL:https://www.panso.best}
    api-key: ${PANSOU_API_KEY:${PANSO_API_KEY:}}
  quark:
    base-url: ${QUARK_AUTO_SAVE_BASE_URL:http://localhost:5005}
    token: ${QUARK_AUTO_SAVE_TOKEN:}
    save-path: ${QUARK_AUTO_SAVE_PATH:/GYing Resource Hub}
    pattern: ${QUARK_AUTO_SAVE_PATTERN:(.*)\.(mp4|mkv|avi|mov|flv|wmv|webm|m4v|ts)}
    replace: ${QUARK_AUTO_SAVE_REPLACE:}
    run-immediately: ${QUARK_AUTO_SAVE_RUN_IMMEDIATELY:true}
    share-enabled: ${QUARK_SHARE_ENABLED:true}
    share-url-type: ${QUARK_SHARE_URL_TYPE:1}
    share-expired-type: ${QUARK_SHARE_EXPIRED_TYPE:1}
    share-passcode: ${QUARK_SHARE_PASSCODE:}
    share-poll-attempts: ${QUARK_SHARE_POLL_ATTEMPTS:12}
    share-poll-interval-ms: ${QUARK_SHARE_POLL_INTERVAL_MS:500}
    xunlei:
      enabled: ${XUNLEI_ENABLED:false}
      base-url: ${XUNLEI_BASE_URL:https://api-pan.xunlei.com/drive/v1}
      authorization: ${XUNLEI_AUTHORIZATION:}
      client-id: ${XUNLEI_CLIENT_ID:}
      device-id: ${XUNLEI_DEVICE_ID:}
      client-version: ${XUNLEI_CLIENT_VERSION:1.82.0}
      captcha-token: ${XUNLEI_CAPTCHA_TOKEN:}
      save-path: ${XUNLEI_SAVE_PATH:/GYing Resource Hub}
      share-enabled: ${XUNLEI_SHARE_ENABLED:false}
      share-create-path: ${XUNLEI_SHARE_CREATE_PATH:}
      poll-attempts: ${XUNLEI_POLL_ATTEMPTS:20}
      poll-interval-ms: ${XUNLEI_POLL_INTERVAL_MS:1000}
  worker:
    enabled: ${RESOURCE_HUB_WORKER_ENABLED:false}
    fixed-delay-ms: ${RESOURCE_HUB_WORKER_FIXED_DELAY_MS:60000}
    task-limit: ${RESOURCE_HUB_WORKER_TASK_LIMIT:5}
    quark-limit: ${RESOURCE_HUB_WORKER_QUARK_LIMIT:5}
    xunlei-limit: ${RESOURCE_HUB_WORKER_XUNLEI_LIMIT:5}
    publish-limit: ${RESOURCE_HUB_WORKER_PUBLISH_LIMIT:20}
  qq-channel-publisher:
    base-url: ${QQ_CHANNEL_PUBLISHER_BASE_URL:http://localhost:8092}
    token: ${QQ_CHANNEL_PUBLISHER_TOKEN:${APP_INTERNAL_TOKEN:}}

social-publisher:
  base-url: ${SOCIAL_PUBLISHER_BASE_URL:http://localhost:8093}
  token: ${SOCIAL_PUBLISHER_TOKEN:${APP_INTERNAL_TOKEN:}}
  scheduler-delay-ms: ${SOCIAL_PUBLISHER_SCHEDULER_DELAY_MS:60000}

qq-bot:
  enabled: ${QQ_BOT_ENABLED:false}
  webhook-token: ${QQ_BOT_WEBHOOK_TOKEN:}
  allowed-groups: ${QQ_BOT_ALLOWED_GROUPS:}
  command-prefixes: "${QQ_BOT_COMMAND_PREFIXES:搜索,搜,找,/movie,/search}"
  max-results: ${QQ_BOT_MAX_RESULTS:3}
  min-keyword-length: ${QQ_BOT_MIN_KEYWORD_LENGTH:2}
  rate-limit-per-minute: ${QQ_BOT_RATE_LIMIT_PER_MINUTE:5}
  blocked-keywords: ${QQ_BOT_BLOCKED_KEYWORDS:}
  auto-transfer: ${QQ_BOT_AUTO_TRANSFER:true}
  default-reply: ${QQ_BOT_DEFAULT_REPLY:机器人使用方法：@机器人 搜/找 影片名；影片上下文保留 5 分钟，可在5分钟内回复指定网盘，例如“百度 3”“夸克 2”。}
  reply-provider: ${QQ_BOT_REPLY_PROVIDER:napcat}
  napcat:
    base-url: ${QQ_BOT_NAPCAT_BASE_URL:http://localhost:3000}
    access-token: ${QQ_BOT_NAPCAT_ACCESS_TOKEN:}
  qqbot:
    app-id: ${QQ_BOT_QQBOT_APP_ID:}
    client-secret: ${QQ_BOT_QQBOT_CLIENT_SECRET:}
    group-openids: ${QQ_BOT_QQBOT_GROUP_OPENIDS:}
    api-base-url: ${QQ_BOT_QQBOT_API_BASE_URL:https://api.sgroup.qq.com}
    token-url: ${QQ_BOT_QQBOT_TOKEN_URL:https://bots.qq.com/app/getAppAccessToken}

jwt:
  secret: ${JWT_SECRET:gying-movie-dev-secret-change-me-please-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
