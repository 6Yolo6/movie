server:
  port: ${SERVER_PORT:8880}

spring:
  application:
    name: gying-movie
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gying?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

minio:
  url-prefix: ${MINIO_URL_PREFIX:http://localhost:9000/gying/}

app:
  internal-token: ${APP_INTERNAL_TOKEN:}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

resource-hub:
  enabled: ${RESOURCE_HUB_ENABLED:false}
  auto-approve: ${RESOURCE_HUB_AUTO_APPROVE:true}
  tmdb:
    api-key: ${TMDB_API_KEY:}
  pansou:
    base-url: ${RESOURCE_HUB_PANSOU_BASE_URL:http://localhost:8888}
    token: ${RESOURCE_HUB_PANSOU_TOKEN:}
  quark:
    base-url: ${QUARK_AUTO_SAVE_BASE_URL:http://localhost:5005}
    token: ${QUARK_AUTO_SAVE_TOKEN:}
    save-path: ${QUARK_AUTO_SAVE_PATH:/GYing Resource Hub}
    pattern: ${QUARK_AUTO_SAVE_PATTERN:(.*)\.(mp4|mkv|avi|mov|flv|wmv|webm|m4v|ts)}
    replace: ${QUARK_AUTO_SAVE_REPLACE:}
    run-immediately: ${QUARK_AUTO_SAVE_RUN_IMMEDIATELY:true}
  worker:
    enabled: ${RESOURCE_HUB_WORKER_ENABLED:false}
    fixed-delay-ms: ${RESOURCE_HUB_WORKER_FIXED_DELAY_MS:60000}
    task-limit: ${RESOURCE_HUB_WORKER_TASK_LIMIT:5}
    quark-limit: ${RESOURCE_HUB_WORKER_QUARK_LIMIT:5}
    publish-limit: ${RESOURCE_HUB_WORKER_PUBLISH_LIMIT:20}

qq-bot:
  enabled: ${QQ_BOT_ENABLED:false}
  webhook-token: ${QQ_BOT_WEBHOOK_TOKEN:}
  allowed-groups: ${QQ_BOT_ALLOWED_GROUPS:}
  command-prefixes: ${QQ_BOT_COMMAND_PREFIXES:找,搜,/movie,/search}
  max-results: ${QQ_BOT_MAX_RESULTS:3}
  auto-transfer: ${QQ_BOT_AUTO_TRANSFER:true}
  napcat:
    base-url: ${QQ_BOT_NAPCAT_BASE_URL:http://localhost:3000}
    access-token: ${QQ_BOT_NAPCAT_ACCESS_TOKEN:}

jwt:
  secret: ${JWT_SECRET:gying-movie-dev-secret-change-me-please-32-bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
