# Windows Docker Desktop + host cloudflared. See docs/security/deployment-checklist.md.
# This file is a deployment target, not proof that existing containers are hardened.
x-security: &security
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nginx:
    <<: *security
    image: nginx:stable-alpine
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:80:8080"
    volumes:
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - ./nginx/trusted-tunnel-peers.conf:/etc/nginx/trusted-tunnel-peers.conf:ro
    depends_on: [frontend, backend]
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    networks: [gying-net]

  backend:
    <<: *security
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # Prefer Docker DNS for embedded/private dependencies; an external private endpoint may be supplied explicitly.
      REDIS_HOST: ${REDIS_HOST:-redis}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      GYING_SOURCE_BASE_URL: ${GYING_SOURCE_BASE_URL:-http://gying-source:8091}
      QUARK_AUTO_SAVE_BASE_URL: ${QUARK_AUTO_SAVE_BASE_URL:-http://quark-auto-save:5005}
      RESOURCE_HUB_PANSOU_BASE_URL: ${RESOURCE_HUB_PANSOU_BASE_URL:-http://pansou:8888}
      SOCIAL_PUBLISHER_BASE_URL: ${SOCIAL_PUBLISHER_BASE_URL:-http://social-publisher:8093}
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      DB_USER: ${DB_USER:?Set a non-root application DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set a scoped MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?Set APP_INTERNAL_TOKEN}
      GYING_SOURCE_API_TOKEN: ${GYING_SOURCE_API_TOKEN:?Set GYING_SOURCE_API_TOKEN}
    # Host-only diagnostics/Windows publishers. OpenClaw MUST use the shared Docker network.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8880}:8880"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    networks: [gying-net, cache-net]

  frontend:
    <<: *security
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: {NEXT_PUBLIC_API_URL: ""}
    environment:
      INTERNAL_API_URL: http://backend:8880
      TZ: Asia/Shanghai
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 128
    networks: [gying-net]

  gying-source:
    <<: *security
    build: {context: ./crawler, dockerfile: Dockerfile}
    # Do NOT inject the complete .env into integrations.
    environment:
      GYING_DB_HOST: ${DB_HOST:-host.docker.internal}
      GYING_DB_PORT: ${DB_PORT:-3306}
      GYING_DB_USER: ${GYING_DB_USER:-${DB_USER:?Set DB_USER}}
      GYING_DB_PASSWORD: ${GYING_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD}}
      GYING_DB_NAME: ${DB_NAME:-gying}
      GYING_MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      GYING_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      GYING_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      GYING_MINIO_BUCKET: ${MINIO_BUCKET:-gying}
      GYING_BASE_URL: ${GYING_BASE_URL:-https://www.xn--wcv59z.com}
      GYING_TARGET_USER: ${GYING_TARGET_USER:-救星小窝}
      GYING_USERNAME: ${GYING_USERNAME:-}
      GYING_PASSWORD: ${GYING_PASSWORD:-}
      GYING_COOKIE: ${GYING_COOKIE:-}
      GYING_SOURCE_API_TOKEN: ${GYING_SOURCE_API_TOKEN:?Set GYING_SOURCE_API_TOKEN}
      GYING_REQUEST_INTERVAL_MS: ${GYING_REQUEST_INTERVAL_MS:-1000}
      TZ: Asia/Shanghai
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    networks: [gying-net]

  social-publisher:
    <<: *security
    build: {context: ./social-publisher, dockerfile: Dockerfile}
    environment:
      SOCIAL_PUBLISHER_PORT: 8093
      SOCIAL_PUBLISHER_TOKEN: ${SOCIAL_PUBLISHER_TOKEN:?Set SOCIAL_PUBLISHER_TOKEN}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${SOCIAL_DB_USER:-${DB_USER:?Set DB_USER}}
      DB_PASSWORD: ${SOCIAL_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD}}
      DB_NAME: ${DB_NAME:-gying}
      QQ_CHANNEL_ACCOUNTS_ROOT: /data/qq-accounts
      SOCIAL_POSTER_BASE_URL: ${SOCIAL_POSTER_BASE_URL:-http://minio:9000/gying/}
      WEIBO_WEB_COOKIE: ${WEIBO_WEB_COOKIE:-}
      WEIBO_WEB_XSRF_TOKEN: ${WEIBO_WEB_XSRF_TOKEN:-}
      WEIBO_WEB_FINGERPRINT: ${WEIBO_WEB_FINGERPRINT:-}
      WEIBO_WEB_CLIENT_VERSION: ${WEIBO_WEB_CLIENT_VERSION:-v1.1.237}
      WEIBO_WEB_USER_AGENT: ${WEIBO_WEB_USER_AGENT:-}
      WEIBO_PROFILE_ROOT: /data/weibo
      TZ: Asia/Shanghai
    cap_drop: [ALL]
    volumes:
      - social-publisher-qq-accounts:/data/qq-accounts
      - social-publisher-weibo:/data/weibo
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    networks: [gying-net]

  redis:
    <<: *security
    profiles: [embedded-deps]
    image: redis:7-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    entrypoint: [sh, /usr/local/bin/gying-redis-entrypoint.sh]
    volumes:
      - ./deploy/redis-entrypoint.sh:/usr/local/bin/gying-redis-entrypoint.sh:ro
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 64
    networks: [cache-net]

  pansou:
    <<: *security
    profiles: [embedded-deps]
    image: ghcr.io/fish2018/pansou:latest
    environment:
      PORT: 8888
      ENABLED_PLUGINS: quark4k,quarksoo,sousou,pansearch,panwiki,hunhepan,jikepan,panta,qupansou,hdr4k,pan666,susu
      CACHE_ENABLED: "true"
      CACHE_PATH: /app/cache
    volumes: [pansou-data:/app/cache]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    networks: [gying-net]

  quark-auto-save:
    <<: *security
    profiles: [embedded-deps]
    image: cp0204/quark-auto-save:latest
    environment:
      QUARK_COOKIE: ${QUARK_COOKIE:?Set QUARK_COOKIE in protected .env}
    # Upstream maintains an authenticated config UI; its volume contains account cookies.
    ports: ["127.0.0.1:5005:5005"]
    volumes: [quark-auto-save-data:/app/config]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 128
    networks: [gying-net]

  napcat:
    <<: *security
    profiles: [legacy-disabled]
    image: mlikiowa/napcat-docker:latest
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:3001:3001", "127.0.0.1:6099:6099"]
    environment: {ACCOUNT: "${NAPCAT_ACCOUNT:-}"}
    volumes: [napcat-data:/app/napcat/config]
    restart: unless-stopped
    networks: [gying-net]

volumes:
  # Keep the historic Redis volume declaration; never delete volumes during hardening.
  redis-data:
  backend-logs:
  backend-data:
  pansou-data:
  quark-auto-save-data:
  napcat-data:
  social-publisher-qq-accounts:
  social-publisher-weibo:

networks:
  gying-net:
    driver: bridge
  cache-net:
    driver: bridge
    internal: true
