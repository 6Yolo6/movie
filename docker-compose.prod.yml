# ============================================================
# Gying Movie - Production Docker Compose
# ============================================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for HTTPS:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - gying-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - backend-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - gying-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""  # Empty = use relative URLs via nginx proxy
    restart: unless-stopped
    networks:
      - gying-net

  redis:
    profiles:
      - embedded-deps
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-gyingredis2024}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - gying-net

  pansou:
    profiles:
      - embedded-deps
    image: ghcr.io/fish2018/pansou:latest
    environment:
      - PORT=8888
      - ENABLED_PLUGINS=quark4k,quarksoo,sousou,pansearch,panwiki,hunhepan,jikepan,panta,qupansou,hdr4k,pan666,susu
      - CACHE_ENABLED=true
      - CACHE_PATH=/app/cache
    volumes:
      - pansou-data:/app/cache
    restart: unless-stopped
    networks:
      - gying-net

  quark-auto-save:
    profiles:
      - embedded-deps
    image: cp0204/quark-auto-save:latest
    ports:
      - "5005:5005"
    volumes:
      - quark-auto-save-data:/app/config
    restart: unless-stopped
    networks:
      - gying-net

  napcat:
    image: mlikiowa/napcat-docker:latest
    ports:
      - "3000:3000"
      - "3001:3001"
      - "6099:6099"
    environment:
      - ACCOUNT=${NAPCAT_ACCOUNT:-}
    volumes:
      - napcat-data:/app/napcat/config
    restart: unless-stopped
    networks:
      - gying-net

volumes:
  redis-data:
  backend-logs:
  pansou-data:
  quark-auto-save-data:
  napcat-data:

networks:
  gying-net:
    driver: bridge
