# Production origin: only host cloudflared can reach published 127.0.0.1:80.
# Access policies also MUST cover /admin and all administrative API shapes.
include /etc/nginx/trusted-tunnel-peers.conf;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_req_status 429;
limit_conn_status 429;

# Requires modern nginx; Docker DNS is re-resolved after application replacement.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend { zone backend 64k; server backend:8880 resolve; keepalive 16; }
upstream frontend { zone frontend 64k; server frontend:3000 resolve; }

server {
    listen 8080;
    server_name _;
    client_max_body_size 9m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn connections 30;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    # TLS is provided by Cloudflare; require Always Use HTTPS there.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # These services are never part of the public HTTP surface, even with an API token.
    location ~* "^/api/(?:internal|qq-bot)(?:/|;|$)" { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }
    location = /api/qq-bot { return 404; }
    location ^~ /api/qq-bot/ { return 404; }
    location ~* ^/(?:actuator|v3/api-docs|swagger-ui|swagger-resources|debug|metrics)(?:/|$) { return 404; }
    location ~ /\. { return 404; }

    location ~ ^/api/auth/(?:login|register|email-code|reset-password)$ {
        limit_req zone=auth burst=5 nodelay;
        client_max_body_size 16k;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend;
    }
    location ~ ^/api/(?:movies|captcha)(?:/|$) {
        limit_req zone=search burst=10 nodelay;
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://backend;
    }

    # Only image namespaces and raster extensions. Do not proxy arbitrary objects or S3 queries.
    location ~* ^/media/((?:mv|tv|ac|tmdb|manual)/[a-z0-9_./-]+\.(?:avif|webp|jpg|jpeg|png|gif))$ {
        limit_except GET HEAD { deny all; }
        set $image_key $1;
        # Clear all client/S3 query parameters before proxying the allow-listed object key.
        # This avoids forwarding listing, response-header overrides or signed URL material.
        set $args "";
        proxy_pass http://minio:9000/gying/$image_key;
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
    location /media/ { return 404; }

    # No extension-wide proxy rule: /api/foo.js must not bypass API security or cache private output.
    location / {
        include /etc/nginx/proxy-headers.conf;
        proxy_pass http://frontend;
    }
}
