# Reviewed Docker Desktop origin peers only. Do not replace with 0.0.0.0/0 or all RFC1918 ranges.
# Recheck nginx transport peers after Docker/network migration (see cloudflare-security.md).
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.18.0.1;
set_real_ip_from 192.168.65.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
